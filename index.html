<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>avodo work space · Sheet</title>
<link id="fav" rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<style>
:root{--p50:#f7f3ff;--p100:#ede5ff;--p200:#dccfff;--p300:#c4b0f7;--p500:#9b7ee6;--p700:#6b4bc2;--ink:#2a2340;--mute:#7b7394;--line:#e4dcf5;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:#fff;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;border-radius:6px;padding:5px 8px}
button:hover{background:var(--p100)}
select{font:inherit;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 6px;height:30px}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:2px 6px}
.logo svg{width:28px;height:28px;display:block}
.logo small{font-weight:500;color:var(--mute);font-size:13px}
#home,#app{height:100%;display:none;flex-direction:column}
.show{display:flex!important}
.hd{padding:12px 20px;border-bottom:1px solid var(--line)}
.hb{flex:1;display:flex;min-height:0}
.rail{width:200px;background:var(--p50);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:4px}
.rail button{text-align:left;padding:10px 12px;font-weight:500}
.rail .on{background:var(--p200)}
.main{flex:1;overflow:auto;padding:28px 36px}
.main h1{margin:0 0 4px;font-size:26px;font-weight:600}
.main p{margin:0 0 22px;color:var(--mute)}
#tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{text-align:left;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.card:hover{border-color:var(--p500);box-shadow:0 6px 18px #9b7ee633;background:#fff}
.th{height:110px;background:var(--p50);padding:12px;display:flex;flex-direction:column;gap:7px}
.th .hr{display:flex;gap:4px}
.th i{font-style:normal;font-size:9px;background:var(--p300);color:#fff;border-radius:3px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.th b{height:7px;background:var(--p100);border-radius:3px}
.card span{display:block;padding:10px 12px 2px;font-weight:600}
.card small{display:block;padding:0 12px 12px;color:var(--mute);font-size:12px}
@media(max-width:640px){.rail{display:none}.main{padding:20px 16px}}
.title{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
#fname{border:1px solid transparent;border-radius:6px;padding:5px 8px;font:inherit;font-weight:600;width:220px;max-width:38vw}
#fname:hover,#fname:focus{border-color:var(--p300);outline:0}
.sp{flex:1}
.pri{background:var(--p500);color:#fff;font-weight:600;padding:7px 14px}
.pri:hover{background:#8667dc}
.menu{position:relative}
.pop{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #6b4bc233;padding:6px;z-index:50;min-width:230px}
.pop.on{display:block}
.pop button{display:block;width:100%;text-align:left;padding:7px 10px}
.title .pop{left:auto;right:0}
#fnm{max-height:320px;overflow:auto}
#fnm small{color:var(--mute)}
.rib{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 10px;background:var(--p50);border-bottom:1px solid var(--line)}
.gp{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line)}
.gp:last-child{border:0}
.rib button{min-width:30px;height:30px}
.clr{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:6px;cursor:pointer}
.clr:hover{background:var(--p100)}
.clr input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.fbar{display:flex;align-items:center;border-bottom:1px solid var(--line)}
#nb{width:80px;text-align:center;border:0;border-right:1px solid var(--line);padding:6px;font:inherit;color:var(--p700);font-weight:600;outline:0;background:#fff}
.fx{padding:0 10px;color:var(--p500);font-style:italic;font-weight:700}
#fi{flex:1;border:0;padding:6px;font:inherit;outline:0;min-width:0}
#gw{flex:1;min-height:0;overflow:auto;scroll-padding:30px 50px}
#grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;font-size:13px}
#grid th{background:var(--p50);color:var(--mute);font-weight:500;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;z-index:2;user-select:none;cursor:default;height:24px}
#grid thead th{top:0}
#grid th.r{left:0;text-align:center}
#grid th.corner{left:0;z-index:3}
#grid th.hl{background:var(--p200);color:var(--p700)}
#grid td{height:24px;padding:0 5px;border-right:1px solid #eee9f8;border-bottom:1px solid #eee9f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:0}
#grid td.sel{box-shadow:inset 0 0 0 100px #9b7ee62a}
#grid td.act{outline:2px solid var(--p500);outline-offset:-2px;box-shadow:none}
#grid td.ed{overflow:visible;text-overflow:clip;background:#fff!important;position:relative;z-index:1;color:var(--ink)!important;text-align:left!important}
.bar{display:flex;align-items:center;border-top:1px solid var(--line);background:var(--p50);padding:0 8px}
#tabs{display:flex;overflow:auto;flex:1}
.tab{border-radius:0 0 8px 8px;padding:7px 14px;white-space:nowrap}
.tab.on{background:#fff;color:var(--p700);font-weight:600;box-shadow:inset 0 -2px var(--p500)}
#stat{color:var(--mute);font-size:12px;white-space:nowrap;padding-left:12px}
.tb{display:flex;gap:2px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line)}
.tb button{border-radius:6px 6px 0 0;padding:6px 16px;font-weight:500}
.tb .on{color:var(--p700);box-shadow:inset 0 -2px var(--p500);font-weight:600}
.pane{display:none}.pane.on{display:flex}
.hint{color:var(--mute);font-size:12px;padding:0 8px}
#grid{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#grid td.ed{-webkit-user-select:text;user-select:text}
#grid thead th{touch-action:none}
#grid.frz tbody tr:first-child td{position:sticky;top:24px;z-index:1;background:#fff}
#grid.frz tbody tr:first-child th{top:24px;z-index:3}
#cdock{display:none;flex:none;gap:10px;overflow-x:auto;padding:8px 10px;border-top:1px solid var(--line);background:var(--p50);height:236px}
.cc{position:relative;flex:0 0 340px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}
.cc button{position:absolute;right:4px;top:2px;padding:2px 6px}
.cc svg{width:100%;height:100%}
.pal{width:268px}
.pop .sw{display:inline-block;width:26px;height:26px;padding:0;margin:2px;border:1px solid #0002;border-radius:6px}
#ctx{position:fixed}
</style>
</head>
<body>

<div id="home" class="show">
  <div class="hd"><span class="logo"><span class="lg"></span>avodo <small>work space</small></span></div>
  <div class="hb">
    <nav class="rail">
      <button class="on">Home</button>
      <button onclick="newFrom('blank')">New</button>
      <button onclick="$('file').click()">Open</button>
    </nav>
    <div class="main">
      <h1 id="greet">Welcome</h1>
      <p>Start with a blank workbook or pick a template. Save to your computer as Excel, PDF or PowerPoint.</p>
      <div id="tpls"></div>
    </div>
  </div>
</div>

<div id="app">
  <div class="title">
    <button class="logo" onclick="goHome()" title="Back to Home"><span class="lg"></span>avodo <small>Sheet</small></button>
    <input id="fname" value="Untitled" oninput="wb.name=this.value" aria-label="File name">
    <span class="sp"></span>
    <div class="menu">
      <button class="pri" onclick="tog('savem',event)">Save to computer ▾</button>
      <div id="savem" class="pop">
        <button onclick="save('xlsx')">Excel Workbook (.xlsx)</button>
        <button onclick="save('pdf')">PDF document (.pdf)</button>
        <button onclick="save('pptx')">PowerPoint (.pptx)</button>
      </div>
    </div>
  </div>
  <div class="tb"><button class="on" onclick="tab(0)">Home</button><button onclick="tab(1)">Insert</button><button onclick="tab(2)">Pro</button></div>
  <div class="rib pane on">
    <div class="gp"><button title="Undo (Ctrl+Z)" onclick="undo()">↶</button><button title="Redo (Ctrl+Y)" onclick="redo()">↷</button></div>
    <div class="gp">
      <button title="Bold (Ctrl+B)" onclick="tgl('b')"><b>B</b></button>
      <button title="Italic (Ctrl+I)" onclick="tgl('i')"><i>I</i></button>
      <div class="menu"><button title="Fill color" onclick="tog('fpt',event)">🎨▾</button><div id="fpt" class="pop pal"></div></div>
      <div class="menu"><button title="Text color" onclick="tog('cpt',event)"><b style="color:#6b4bc2;border-bottom:3px solid #9b7ee6;line-height:1.1">A</b>▾</button><div id="cpt" class="pop pal"></div></div>
    </div>
    <div class="gp">
      <button title="Align left" onclick="sty(o=>o.a='left')"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h12M2 7h8M2 11h12"/></svg></button>
      <button title="Center" onclick="sty(o=>o.a='center')"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h12M4 7h8M2 11h12"/></svg></button>
      <button title="Align right" onclick="sty(o=>o.a='right')"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h12M6 7h8M2 11h12"/></svg></button>
    </div>
    <div class="gp">
      <select id="nf" title="Number format" onchange="const v=this.value;sty(o=>o.f=v==='g'?undefined:v);this.blur()">
        <option value="g">General</option><option value="n">Number</option><option value="$">Currency</option><option value="%">Percent</option>
      </select>
    </div>
    <div class="gp">
      <button title="AutoSum" onclick="autoSum()"><b>Σ</b> AutoSum</button>
      <div class="menu"><button title="Insert function" onclick="tog('fnm',event)"><i>fx</i> Functions ▾</button><div id="fnm" class="pop"></div></div>
    </div>
    <div class="gp">
      <button onclick="addRows()">+ Rows</button>
      <button onclick="clr()">Clear</button>
      <button title="Reset formatting" onclick="sty(o=>{for(const p of ['b','i','bg','c','f','a'])delete o[p]})">Reset format</button>
    </div>
  </div>
  <div class="rib pane">
    <div class="gp"><button onclick="addChart('bar')">📊 Bar chart</button><button onclick="addChart('line')">📈 Line chart</button><button onclick="addChart('pie')">🥧 Pie chart</button></div>
    <div class="gp" id="cellops"></div>
    <span class="hint">Charts use the selected data and update live. Tap a row/column header to select it, or long-press a cell and drag. On PC you can also right-click a cell.</span>
  </div>
  <div class="rib pane">
    <div class="gp"><button onclick="sortCol(1)">Sort A→Z</button><button onclick="sortCol(-1)">Sort Z→A</button></div>
    <div class="gp"><button onclick="filt()">Filter…</button><button onclick="filt(1)">Clear filter</button></div>
    <div class="gp"><button onclick="$('grid').classList.toggle('frz')">Freeze top row</button><button onclick="autoFit()">Auto-fit width</button></div>
    <div class="gp"><button onclick="fill('d')">Fill down</button><button onclick="fill('r')">Fill right</button><button onclick="findRep()">Find &amp; Replace</button></div>
    <div class="gp"><button onclick="cfmt()">Conditional format</button><button onclick="tgl('bd')">Borders</button></div>
  </div>
  <div class="fbar"><input id="nb" readonly aria-label="Cell"><span class="fx">fx</span><input id="fi" placeholder="Type a value, or a formula like =SUM(A1:A5). While typing a formula, click or drag cells to insert them." aria-label="Formula bar"></div>
  <div id="gw"><table id="grid"></table></div>
  <div id="cdock"></div>
  <div class="bar"><div id="tabs"></div><button onclick="addSheet()" title="New sheet">＋</button><select id="em" title="Direction after Enter" onchange="EM=this.value;try{localStorage.avEM=EM}catch(e){}this.blur()"><option value="r">Enter → Right</option><option value="d">Enter ↓ Down</option></select><span id="stat"></span></div>
</div>
<div id="ctx" class="pop"></div>
<input type="file" id="file" hidden accept=".xlsx,.xls,.csv">

<script>
const $=i=>document.getElementById(i),qa=s=>document.querySelectorAll(s),g=$('grid');
const L=c=>c<26?String.fromCharCode(65+c):L(Math.floor(c/26)-1)+L(c%26);
const P=k=>{const m=/^([A-Z]+)(\d+)$/.exec(k);let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return{c:c-1,r:m[2]-1}};
const key=p=>L(p.c)+(p.r+1);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- Logo (avocado mark on a lavender tile) ---------- */
const LOGO='<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="16" fill="#a98bf2"/><path d="M32 9c6 0 9 6 9 12 0 4 5 7 5 14 0 9-6 15-14 15s-14-6-14-15c0-7 5-10 5-14 0-6 3-12 9-12z" fill="#fff"/><circle cx="32" cy="41" r="7.5" fill="#7b57d8"/></svg>';
qa('.lg').forEach(e=>e.innerHTML=LOGO);
$('fav').href='data:image/svg+xml,'+encodeURIComponent(LOGO);

/* ---------- State ---------- */
let wb,A={c:0,r:0},Fo={c:0,r:0},COLS=26,ROWS=60,editing=null,drag=0,U=[],Rd=[],cache={},vis=new Set();
const sh=()=>wb.sheets[wb.cur];
const rng=()=>({c1:Math.min(A.c,Fo.c),c2:Math.max(A.c,Fo.c),r1:Math.min(A.r,Fo.r),r2:Math.max(A.r,Fo.r)});
const cl=(c,r)=>g.rows[r+1].cells[c+1];
const name=()=>((wb.name||'').trim().replace(/[\\\/:*?"<>|]/g,'_'))||'avodo-sheet';
const used=s=>{let R=0,C=0;for(const k in s.d){const p=P(k);R=Math.max(R,p.r+1);C=Math.max(C,p.c+1)}return{R,C}};

/* ---------- Formula engine (28 functions) ---------- */
const flat=a=>a.flat(Infinity),nums=a=>flat(a).filter(x=>typeof x==='number');
const crit=c=>{if(typeof c==='number')return x=>x===c;const m=/^(<=|>=|<>|=|<|>)?(.*)$/.exec(String(c)),op=m[1]||'=',t=m[2],n=t!==''&&!isNaN(t)?+t:t;
  return x=>{if(x==null)x='';switch(op){case'>':return x>n;case'<':return x<n;case'>=':return x>=n;case'<=':return x<=n;case'<>':return x!=n;default:return typeof n==='string'?String(x).toLowerCase()===n.toLowerCase():x===n}}};
const FN=[['SUM','number1, number2, …'],['AVERAGE','number1, …'],['MIN','number1, …'],['MAX','number1, …'],['COUNT','numbers in range'],['COUNTA','non-empty cells'],['ROUND','number, digits'],['ABS','number'],['SQRT','number'],['POWER','number, power'],['MOD','number, divisor'],['INT','number'],['PRODUCT','number1, …'],['MEDIAN','number1, …'],['IF','test, if_true, if_false'],['AND','test1, test2, …'],['OR','test1, test2, …'],['NOT','test'],['CONCAT','text1, text2, …'],['UPPER','text'],['LOWER','text'],['LEN','text'],['LEFT','text, count'],['RIGHT','text, count'],['TODAY','current date'],['NOW','current date and time'],['SUMIF','range, criteria, [sum_range]'],['COUNTIF','range, criteria']];
const F={
 SUM:(...a)=>nums(a).reduce((x,y)=>x+y,0),
 AVERAGE:(...a)=>{const n=nums(a);return n.length?F.SUM(n)/n.length:'#DIV/0!'},
 MIN:(...a)=>{const n=nums(a);return n.length?Math.min(...n):0},
 MAX:(...a)=>{const n=nums(a);return n.length?Math.max(...n):0},
 COUNT:(...a)=>nums(a).length,
 COUNTA:(...a)=>flat(a).filter(x=>x!=null&&x!=='').length,
 ROUND:(x,d=0)=>+(Math.round(x+'e'+d)+'e-'+d),
 ABS:Math.abs,SQRT:x=>x<0?'#NUM!':Math.sqrt(x),POWER:Math.pow,
 MOD:(a,b)=>b?((a%b)+b)%b:'#DIV/0!',INT:Math.floor,
 PRODUCT:(...a)=>nums(a).reduce((x,y)=>x*y,1),
 MEDIAN:(...a)=>{const n=nums(a).sort((x,y)=>x-y),m=n.length>>1;return n.length?(n.length%2?n[m]:(n[m-1]+n[m])/2):'#NUM!'},
 IF:(c,a,b=false)=>c?a:b,
 AND:(...a)=>flat(a).every(Boolean),OR:(...a)=>flat(a).some(Boolean),NOT:x=>!x,
 CONCAT:(...a)=>flat(a).filter(x=>x!=null).join(''),
 UPPER:x=>String(x).toUpperCase(),LOWER:x=>String(x).toLowerCase(),LEN:x=>String(x).length,
 LEFT:(s,n=1)=>String(s).slice(0,n),RIGHT:(s,n=1)=>n?String(s).slice(-n):'',
 TODAY:()=>new Date().toLocaleDateString(),NOW:()=>new Date().toLocaleString(),
 SUMIF:(r,c,s=r)=>{const t=crit(c),a=flat([r]),b=flat([s]);return a.reduce((acc,x,i)=>acc+(t(x)&&typeof b[i]==='number'?b[i]:0),0)},
 COUNTIF:(r,c)=>flat([r]).filter(crit(c)).length
};
const fc={};
function compile(f){return fc[f]||(fc[f]=new Function('_C','_R','F','return '+f.split(/("[^"]*")/).map((p,i)=>i%2?p:p
  .replace(/\$/g,'').replace(/\b([A-Z]+\d+):([A-Z]+\d+)\b/gi,'_R("$1","$2")')
  .replace(/\b([A-Z][A-Z0-9.]*)\(/gi,(m,n)=>'F.'+n.toUpperCase()+'(')
  .replace(/\bTRUE\b/gi,'true').replace(/\bFALSE\b/gi,'false')
  .replace(/(?<![\w."])([A-Z]{1,3}\d+)(?![\w"(])/gi,'_C("$1")')
  .replace(/<>/g,'!=').replace(/(?<![<>!=])=(?!=)/g,'==').replace(/\^/g,'**').replace(/&/g,'+""+')).join('')))}
const _C=k=>{const v=val(k.toUpperCase());return v==null?0:v};
const _R=(a,b)=>{const p=P(a.toUpperCase()),q=P(b.toUpperCase()),o=[];for(let r=Math.min(p.r,q.r);r<=Math.max(p.r,q.r);r++)for(let c=Math.min(p.c,q.c);c<=Math.max(p.c,q.c);c++)o.push(val(L(c)+(r+1)));return o};
function val(k){
  if(k in cache)return cache[k];
  const raw=sh().d[k];if(raw==null||raw==='')return cache[k]=null;
  if(raw[0]!=='=')return cache[k]=(raw.trim()!==''&&!isNaN(raw)?+raw:raw);
  if(vis.has(k))return'#CIRC!';
  vis.add(k);let v;if(raw.includes('#REF!')){vis.delete(k);return cache[k]='#REF!'}
  try{v=compile(raw.slice(1))(_C,_R,F);if(Array.isArray(v))v=v[0];if(typeof v==='number'&&!isFinite(v))v='#DIV/0!'}catch(e){v='#ERR!'}
  vis.delete(k);return cache[k]=v;
}
function fv(v,f){
  if(v==null)return'';if(typeof v==='boolean')return v?'TRUE':'FALSE';if(typeof v!=='number')return String(v);
  if(f==='n')return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(f==='$')return v.toLocaleString('en-US',{style:'currency',currency:'USD'});
  if(f==='%')return(v*100).toFixed(1)+'%';
  return String(+v.toPrecision(12));
}

/* ---------- Grid ---------- */
function build(){
  const s=sh(),u=used(s);COLS=Math.min(MAXC,Math.max(52,u.C+1,s.C||0));ROWS=Math.min(MAXR,Math.max(1000,u.R+5,s.R||0));
  let h='<colgroup><col style="width:46px">'+Array.from({length:COLS},(_,c)=>`<col style="width:${(s.w||{})[c]||100}px">`).join('')+'</colgroup><thead><tr><th class="corner"></th>';
  for(let c=0;c<COLS;c++)h+=`<th class="c" data-c="${c}">${L(c)}</th>`;
  h+='</tr></thead><tbody>';
  for(let r=0;r<ROWS;r++){h+=`<tr><th class="r" data-r="${r}">${r+1}</th>`;for(let c=0;c<COLS;c++)h+=`<td data-k="${L(c)}${r+1}"></td>`;h+='</tr>'}
  g.innerHTML=h+'</tbody>';
  (s.mg||[]).forEach(m=>{if(m.r2<ROWS&&m.c2<COLS){const t=cl(m.c1,m.r1);t.colSpan=m.c2-m.c1+1;t.rowSpan=m.r2-m.r1+1}});
}
function paint(ns){
  cache={};vis=new Set();const s=sh(),cv=new Set();
  (s.mg||[]).forEach(m=>{for(let r=m.r1;r<=m.r2;r++)for(let c=m.c1;c<=m.c2;c++)if(r>m.r1||c>m.c1)cv.add(L(c)+(r+1))});
  vtd().forEach(td=>{
    if(td===editing)return;
    const k=td.dataset.k,v=val(k),o=s.s[k]||{},er=typeof v==='string'&&/^#[A-Z\/0-9]+!$/.test(v),al=o.a||(typeof v==='number'?'right':'');
    td.textContent=fv(v,o.f);

  });

/* ---------- Merge, insert/delete rows & columns, color palettes ---------- */

const mv1=(v,role,i,n)=>n>0?(v>=i?v+1:v):(v>i?v-1:v<i?v:role==='e'?v-1:role==='s'?v:-9);

  if(f[0]!=='=')return f;

  return f.split(/("[^"]*")/).map((p,k)=>k%2?p:p.replace(/(?<![\w.])(\$?)([A-Z]{1,3})(\$?)(\d+)(?::(\$?)([A-Z]{1,3})(\$?)(\d+))?(?![\w(])/gi,(m,a,c,b,r,a2,c2,b2,r2)=>{
    if(c2===undefined){const v=mv1(gv(c,r),'x',i,n);return v<0?'#REF!':out(a,c,b,r,v)}

function shiftSheet(ax,i,n){

  for(const k in s.d){const nk=mp(k);if(nk)nd[nk]=adjF(s.d[k],ax,i,n)}

  if(ax==='c'&&s.w)s.w=mk1(s.w);if(ax==='r'&&s.hid)s.hid=mk1(s.hid);

/* ---------- Save to computer: xlsx / pdf / pptx ---------- */
function withSheet(i,f){const o=wb.cur;wb.cur=i;cache={};vis=new Set();try{return f()}finally{wb.cur=o;cache={};vis=new Set()}}

function outX(){

  });

}
function outP(){
  const{jsPDF}=window.jspdf,d=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});

    if(i)d.addPage();const m=matrix(i),n=m[0]?m[0].length:1,cw=Math.max(40,Math.min(110,770/n)),rh=20;

        d.text(d.splitTextToSize(c.t,cw-8)[0]||'',a==='left'?x+4:a==='right'?x+cw-4:x+cw/2,y+13,{align:a});

}
function save(t){

  (async()=>{
    try{
      const data=await ({xlsx:outX,pdf:outP,pptx:outS})[t](),filename=name()+'.'+t,dl=window.claude&&claude.use?await claude.use('downloads'):null;
